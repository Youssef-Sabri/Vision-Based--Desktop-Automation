[project]
name = "vision-desktop-automation"
version = "0.1.0"
description = "Vision-Based Desktop Automation with Dynamic Icon Grounding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "pillow>=10.2.0",
    "google-genai",
    "python-dotenv",
    "requests>=2.31.0",
    "keyboard"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
managed = true
